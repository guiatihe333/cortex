# AMB-1's build settings (fm1-base's tools/build.py: ./build.sh)
name = "AMB"                   # the build's files: amb.fwsc, amb-X.Y.fwsc
id_prefix = "FM-1_76"          # package identity, AMB-1 FM6's own (AMB-1's is FM-1_7): releases FM-1_76XXYYZZ
usb_manufacturer = "AMB-1"
usb_product = "AMB-1 FM-1"
ble = false                    # AMB-1 never uses the radio
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/amb.c"]             # the engine, at -O2
# the site
tagline = "AMB-1 FM6: AMB-1 with FM6 voices, DX7 banks and a reel of tape (unofficial)"
repo = "https://github.com/guiatihe333/lostgear/tree/claude/amb1-jiant-fm6/fm1-amb-fm6"
licence = "MPL-2.0"
credits = "An unofficial fork of AMB-1 by Charles Vestal; the FM6 core is msfa (Dexed), by way of JIANT FM. Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
