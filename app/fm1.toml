# CORTEX's build settings (fm1-base's tools/build.py: ./build.sh)
name = "CORTEX"                # the build's files: cortex.fwsc, cortex-X.Y.fwsc
id_prefix = "FM-1_76"          # package identity, CORTEX's own (AMB-1's is FM-1_7): releases FM-1_76XXYYZZ
usb_manufacturer = "CORTEX"
usb_product = "CORTEX FM-1"
ble = false                    # CORTEX never uses the radio
usb_audio_in = true            # the music recordable over USB
usb_audio_out = true           # a phone or a computer plays into it (the reel records it: SOURCE USB)
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/amb.c"]             # the engine, at -O2
# the site
tagline = "A generative FM instrument and video synth for the FM-1"
repo = "https://github.com/guiatihe333/cortex"
licence = "MPL-2.0"
credits = "A fork of AMB-1 by Charles Vestal; the FM6 core is msfa (Dexed), by way of JIANT FM. Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."

# firmware.json, for firmware hubs (fm1-base docs/FIRMWARE-JSON.md)
author = "guiatihe333"
description = "CORTEX turns the M-VAVE FM-1 into a generative FM instrument. Three six-operator FM voices with DX7 banks play chords, bells and bass that grow by themselves, each with an ADSR, a Moog-style low-pass filter and five modulators; a reel of tape records and replays them. Songs come in from MIDI files. A video synth on the screen moves with the music, with LZX- and Hydra-style oscillators and twelve ready looks. Tom, a cartoon cat, walks across the screen and explains every page and knob as you play. It plays itself from the moment it is switched on, and every knob can be played or rolled."
tags = ["synth", "fm", "generative", "ambient", "sequencer"]
install = "https://guiatihe333.github.io/cortex/install/"
site = "https://guiatihe333.github.io/cortex/"
screenshot = "docs/img/cortex-card.png"

ram_layout = "packed"           # one SRAM budget (1.5.20): the RAM code area mostly empty, its room the pool's
